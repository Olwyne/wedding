server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache HTML — always fresh so script/css version busters work
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Cache JS/CSS aggressively (versioned via ?v=N query param)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
