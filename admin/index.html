<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back office — Sophie &amp; Ruiyuan</title>
<link rel="stylesheet" href="/admin/styles.css?v=15">
</head>
<body>

<div id="login-screen" class="login-screen" hidden>
  <form id="login-form" class="login-form">
    <div class="login-monogram">S·R</div>
    <h1>Back office</h1>
    <p class="login-sub">Sophie &amp; Ruiyuan — Administration</p>
    <label class="field">
      <span>Email</span>
      <input id="login-email" type="email" required>
    </label>
    <label class="field">
      <span>Mot de passe</span>
      <input id="login-password" type="password" required>
    </label>
    <p id="login-error" class="login-error" hidden></p>
    <button type="submit" class="btn-primary">Se connecter</button>
  </form>
</div>

<div id="dashboard" class="dashboard" hidden>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">S·R</div>
      <div>
        <div class="sidebar-brand-title">S &amp; R</div>
        <div class="sidebar-brand-sub">Administration</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-section="dashboard">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></span> Accueil
      </button>
      <button class="nav-item" data-section="blocks" hidden>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Blocs
      </button>
      <button class="nav-item" data-section="vendors" hidden>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9M14 17H5M17 4l3 3-3 3M7 14l-3 3 3 3"/></svg></span> Prestations
      </button>
      <button class="nav-item" data-section="budget" hidden>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 10v4M2 10h20"/></svg></span> Budget
      </button>
      <button class="nav-item" data-section="guests" hidden>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Invités
      </button>
      <button class="nav-item" data-section="witnesses" hidden>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 1 5 5v2a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5z"/><path d="M8 21v-3a4 4 0 0 1 4-4 4 4 0 0 1 4 4v3"/></svg></span> Témoins
      </button>
      <button class="nav-item" data-section="tables" hidden>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></span> Tables
      </button>
      <button class="nav-item" data-section="events" hidden>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span> Événements
      </button>
      <button class="nav-item" data-section="todo" hidden>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span> To-Do
      </button>
      <button class="nav-item" data-section="calendar" hidden>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg></span> Calendrier
      </button>
      <button class="nav-item" data-section="users" hidden>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg></span> Utilisateurs
      </button>
    </nav>
    <div class="sidebar-footer">
      <button id="account-btn" class="btn-secondary sidebar-logout">Mon compte</button>
      <button id="logout-btn" class="btn-secondary sidebar-logout">Se déconnecter</button>
    </div>
  </aside>
  <main class="content-area">
    <div class="content-header">
      <h2 id="section-title">Accueil</h2>
      <div id="section-action"></div>
    </div>
    <div class="content-body">
      <div id="tab-dashboard" class="tab-panel"></div>
      <div id="tab-blocks" class="tab-panel" hidden></div>
      <div id="tab-vendors" class="tab-panel" hidden></div>
      <div id="tab-budget" class="tab-panel" hidden></div>
      <div id="tab-guests" class="tab-panel" hidden></div>
      <div id="tab-witnesses" class="tab-panel" hidden></div>
      <div id="tab-tables" class="tab-panel" hidden></div>
      <div id="tab-events" class="tab-panel" hidden></div>
      <div id="tab-todo" class="tab-panel" hidden></div>
      <div id="tab-calendar" class="tab-panel" hidden></div>
      <div id="tab-users" class="tab-panel" hidden></div>
    </div>
  </main>
</div>

<script type="module" src="/admin/script.js?v=19"></script>
</body>
</html>
