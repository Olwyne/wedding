<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back office — Sophie &amp; Ruiyuan</title>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<div id="login-screen" class="login-screen">
  <form id="login-form" class="login-form">
    <div class="login-monogram">S·R</div>
    <h1>Back office</h1>
    <p class="login-sub">Sophie &amp; Ruiyuan — Administration</p>
    <label class="field">
      <span>Email</span>
      <input id="login-email" type="email" required>
    </label>
    <label class="field">
      <span>Mot de passe</span>
      <input id="login-password" type="password" required>
    </label>
    <p id="login-error" class="login-error" hidden></p>
    <button type="submit" class="btn-primary">Se connecter</button>
  </form>
</div>

<div id="dashboard" class="dashboard" hidden>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">S·R</div>
      <div>
        <div class="sidebar-brand-title">S &amp; R</div>
        <div class="sidebar-brand-sub">Administration</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-section="blocks">
        <span class="nav-icon">⬛</span> Blocs
      </button>
      <button class="nav-item" data-section="sections">
        <span class="nav-icon">🗂️</span> Sections
      </button>
      <button class="nav-item" data-section="guests">
        <span class="nav-icon">👥</span> Invités
      </button>
      <button class="nav-item" data-section="events">
        <span class="nav-icon">📅</span> Événements
      </button>
    </nav>
    <div class="sidebar-footer">
      <button id="logout-btn" class="btn-secondary sidebar-logout">Se déconnecter</button>
    </div>
  </aside>
  <main class="content-area">
    <div class="content-header">
      <h2 id="section-title">Blocs</h2>
      <div id="section-action"></div>
    </div>
    <div class="content-body">
      <div id="tab-blocks" class="tab-panel"></div>
      <div id="tab-sections" class="tab-panel" hidden></div>
      <div id="tab-guests" class="tab-panel" hidden></div>
      <div id="tab-events" class="tab-panel" hidden></div>
    </div>
  </main>
</div>

<script type="module" src="script.js?v=2"></script>
</body>
</html>
