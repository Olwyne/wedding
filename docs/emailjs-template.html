<!-- Coller dans EmailJS > Template > Code Editor (icône </>) -->
<div style="background:#f5f1e6;padding:40px 16px;font-family:Georgia,'Times New Roman',serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08);">
    <tr>
      <td style="background:#6E1A1A;padding:36px 32px;text-align:center;">
        <div style="font-size:38px;color:#C1993F;line-height:1;margin-bottom:10px;">囍</div>
        <div style="color:#F4E9CE;font-size:13px;letter-spacing:.2em;text-transform:uppercase;">Sophie &amp; Ruiyuan</div>
        <div style="color:#F4E9CE;font-size:12px;letter-spacing:.15em;opacity:.75;margin-top:4px;">24 · 07 · 2027</div>
      </td>
    </tr>
    <tr>
      <td style="padding:34px 32px 10px;">
        <h1 style="margin:0 0 6px;font-size:22px;color:#3a1010;font-weight:600;">Réponse RSVP — {{status}}</h1>
        <p style="margin:0 0 24px;font-size:14px;color:#777;">de {{guest_name}}</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#999;font-size:12px;letter-spacing:.05em;text-transform:uppercase;width:40%;">Email</td>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#3a1010;font-size:14px;">{{email}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#999;font-size:12px;letter-spacing:.05em;text-transform:uppercase;">Téléphone</td>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#3a1010;font-size:14px;">{{phone}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#999;font-size:12px;letter-spacing:.05em;text-transform:uppercase;">Adultes</td>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#3a1010;font-size:14px;">{{adults}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#999;font-size:12px;letter-spacing:.05em;text-transform:uppercase;">Enfants</td>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#3a1010;font-size:14px;">{{children}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#999;font-size:12px;letter-spacing:.05em;text-transform:uppercase;">Événements</td>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#3a1010;font-size:14px;">{{events}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#999;font-size:12px;letter-spacing:.05em;text-transform:uppercase;">Allergies / régime</td>
            <td style="padding:10px 0;border-bottom:1px solid #eee;color:#3a1010;font-size:14px;">{{diet}}</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px 8px;">
        <div style="font-size:12px;color:#999;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;">Message</div>
        <p style="margin:0;font-size:14px;color:#3a1010;line-height:1.6;font-style:italic;">« {{message}} »</p>
      </td>
    </tr>
    <tr>
      <td style="padding:30px 32px 36px;text-align:center;">
        <div style="height:1px;background:#eee;margin-bottom:24px;"></div>
        <p style="margin:0;font-size:13px;color:#aaa;letter-spacing:.03em;">Avec toute notre affection,<br>Sophie &amp; Ruiyuan</p>
      </td>
    </tr>
  </table>
</div>
